# Alembic config for the Axle / JAKS ERP.
#
# Migrations run automatically on app startup via app/db_migrate.py (which builds
# its Config programmatically). This file exists for the developer CLI workflow:
#
#   .venv\Scripts\alembic.exe revision -m "add X" --autogenerate
#   .venv\Scripts\alembic.exe upgrade head
#   .venv\Scripts\alembic.exe current / history
#
# env.py runs migrations against app.database.engine, so the sqlalchemy.url below
# is only a fallback for offline (--sql) generation against the default file DB.

[alembic]
script_location = app/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///data/jaks.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
