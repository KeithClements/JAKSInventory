<tr id="vsrc-{{ source.id }}" class="border-b border-gray-100">
  <td class="px-4 py-3 text-sm text-gray-800">{{ source.vendor.name }}</td>
  <td class="px-4 py-3 font-mono text-sm text-gray-600">{{ source.vendor_part_number or '—' }}</td>
  <td class="px-4 py-3 text-sm text-right text-gray-600">${{ "%.2f"|format(source.vendor_cost) }}</td>
  <td class="px-4 py-3 text-center">
    {% if source.lead_time_days %}
      <span class="text-xs text-gray-500">{{ source.lead_time_days }}d</span>
    {% else %}
      <span class="text-gray-300">—</span>
    {% endif %}
  </td>
  <td class="px-4 py-3 text-center">
    {% if source.is_preferred %}
      <span class="inline-flex rounded-full bg-green-100 text-green-700 px-2 py-0.5 text-xs font-medium">Preferred</span>
    {% else %}
      <button type="button"
              hx-post="/products/{{ product_id }}/vendor-sources/{{ source.id }}/prefer"
              hx-target="#vendor-sources-body"
              hx-swap="innerHTML"
              class="rounded-lg bg-gray-100 px-2 py-1 text-xs font-medium text-gray-600 hover:bg-gray-200">
        Set Preferred
      </button>
    {% endif %}
  </td>
  <td class="px-4 py-3 text-center">
    <button type="button"
            hx-delete="/products/{{ product_id }}/vendor-sources/{{ source.id }}"
            hx-target="closest tr"
            hx-swap="outerHTML swap:200ms"
            hx-confirm="Remove this vendor source?"
            class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-medium text-red-600 hover:bg-red-50">
      Remove
    </button>
  </td>
</tr>
