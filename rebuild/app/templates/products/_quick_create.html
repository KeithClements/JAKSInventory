{#
  Quick Create Product slide-over content.
  Loaded via HTMX into #create-slide-content in base.html.
  Used when "Add non-stocked item" is chosen from quote search.
#}
<form
  class="flex flex-col flex-1 min-h-0"
  hx-post="/products/quick-create"
  hx-target="#create-slide-content"
  hx-swap="innerHTML"
>
  <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        SKU <span class="text-red-500">*</span>
      </label>
      <div class="flex gap-2 items-center">
        <span class="px-2 py-2 text-sm text-gray-500 bg-gray-100 border border-gray-300 border-r-0 rounded-l-lg">JAKS-</span>
        <input type="text" name="sku_suffix" required autofocus
               class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-r-lg
                      focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
               placeholder="PAI-311148"/>
      </div>
      <p class="mt-1 text-xs text-gray-400">Full SKU: JAKS-[what you type]</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Title / Description <span class="text-red-500">*</span>
      </label>
      <input type="text" name="title" required
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="e.g. Inframe Kit ISX"/>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Unit Cost</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
        <input type="number" name="cost" min="0" step="0.01" value="0.00"
               x-data x-ref="costInput"
               class="w-full pl-6 pr-3 py-2 text-sm border border-gray-300 rounded-lg
                      focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"/>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Markup %</label>
      <div
        x-data="{ markup: 30, cost: 0 }"
        x-init="
          $watch('markup', v => {});
          document.querySelector('[name=cost]').addEventListener('input', e => { cost = parseFloat(e.target.value) || 0 });
        "
        class="flex gap-3 items-center"
      >
        <input type="number" name="markup_pct" min="0" max="300" step="1"
               x-model="markup"
               class="w-24 px-3 py-2 text-sm border border-gray-300 rounded-lg
                      focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"/>
        <span class="text-sm text-gray-500">%</span>
        <span class="text-sm text-gray-500">→ Sell:
          <span class="font-medium text-gray-900"
                x-text="'$' + (cost * (1 + markup / 100)).toFixed(2)"></span>
        </span>
      </div>
    </div>

    <div x-data="{
           hasCore: false,
           vendorCore: 0,
           customerCore: 0,
           get coreFlag() { return this.hasCore && Number(this.customerCore||0) < Number(this.vendorCore||0); }
         }">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" name="has_core" x-model="hasCore"
               class="rounded border-gray-300 text-blue-600 focus:ring-brand-400"/>
        <span class="text-sm font-medium text-gray-700">Has Core Charge</span>
      </label>
      <div x-show="hasCore" x-cloak class="mt-2 flex gap-3">
        <div class="flex-1">
          <label class="block text-xs text-gray-500 mb-1">Vendor Core $</label>
          <input type="number" name="vendor_core_charge" min="0" step="0.01" value="0.00"
                 x-model.number="vendorCore"
                 class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                        focus:outline-none focus:ring-1 focus:ring-brand-400"
                 :class="coreFlag ? 'ring-1 ring-red-400 border-red-300' : ''"/>
        </div>
        <div class="flex-1">
          <label class="block text-xs text-gray-500 mb-1">Customer Core $</label>
          <input type="number" name="customer_core_charge" min="0" step="0.01" value="0.00"
                 x-model.number="customerCore"
                 class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                        focus:outline-none focus:ring-1 focus:ring-brand-400"
                 :class="coreFlag ? 'ring-1 ring-red-400 border-red-300' : ''"/>
        </div>
      </div>
      <div x-show="coreFlag" x-cloak
           class="mt-2 flex items-start gap-2 rounded-lg bg-red-50 border border-red-200 px-3 py-2 text-xs text-red-700">
        <svg class="w-4 h-4 shrink-0 mt-px" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
        </svg>
        <span>
          Customer core (<span x-text="'$' + Number(customerCore||0).toFixed(2)"></span>)
          must be ≥ vendor core (<span x-text="'$' + Number(vendorCore||0).toFixed(2)"></span>).
        </span>
      </div>
    </div>

  </div>

  <div class="flex justify-end gap-3 px-5 py-4 border-t border-gray-200 shrink-0">
    <button type="button"
            @click="createSlideOpen = false"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
      Cancel
    </button>
    <button type="submit"
            :disabled="coreFlag"
            class="px-4 py-2 text-sm font-medium text-white bg-brand-700 hover:bg-brand-600 rounded-lg
                   disabled:opacity-50 disabled:cursor-not-allowed">
      Save &amp; Select
    </button>
  </div>
</form>
