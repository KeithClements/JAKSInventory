<div x-data="{ vendorId: '' }">
  <form method="post" action="/purchase-orders/new" class="space-y-4">

    <div>
      <label class="form-label">Vendor <span class="text-red-500">*</span></label>
      <div class="flex gap-2"
           x-data
           @record-created.window="
             if ($event.detail.type === 'vendor') {
               var sel = $el.querySelector('select[name=vendor_id]');
               var opt = document.createElement('option');
               opt.value = $event.detail.id;
               opt.textContent = $event.detail.label;
               opt.selected = true;
               sel.appendChild(opt);
               sel.value = String($event.detail.id);
               vendorId = String($event.detail.id);
             }
           ">
        <select name="vendor_id" required x-model="vendorId" class="form-select flex-1">
          <option value="">— Select Vendor —</option>
          {% for v in vendors %}
          <option value="{{ v.id }}">{{ v.name }}</option>
          {% endfor %}
        </select>
        <button type="button"
                hx-get="/vendors/quick-create-form"
                hx-target="#create-slide-content"
                hx-swap="innerHTML"
                @click="$dispatch('open-create-slide', { title: 'New Vendor' })"
                class="px-3 py-2 text-xs font-medium text-brand-700 border border-brand-200
                       rounded-lg bg-brand-50 hover:bg-brand-100 transition-colors whitespace-nowrap">
          + New
        </button>
      </div>
    </div>

    <div>
      <label class="form-label">Order Type</label>
      <select name="status" class="form-select">
        <option value="draft">Draft PO</option>
        <option value="verbal_order">Verbal / Phone Order</option>
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="form-label">Expected Delivery</label>
        <input type="date" name="expected_at" class="form-input" />
      </div>
      <div>
        <label class="form-label">Vendor Conf #</label>
        <input type="text" name="vendor_confirmation_number"
               placeholder="Verbal order #" class="form-input font-mono" />
      </div>
    </div>

    <div>
      <label class="form-label">Notes</label>
      <textarea name="notes" rows="2" placeholder="Shipping instructions, special requests…"
                class="form-textarea"></textarea>
    </div>

    <div class="pt-2 flex gap-3">
      <button type="submit"
              :disabled="!vendorId"
              :class="vendorId ? 'btn-primary' : 'btn-primary opacity-40 cursor-not-allowed'">
        Create PO
      </button>
      <button type="button" @click="createSlideOpen = false" class="btn-secondary">Cancel</button>
    </div>

  </form>
</div>
