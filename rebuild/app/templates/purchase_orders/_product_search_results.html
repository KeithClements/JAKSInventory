{% if results %}
<ul class="py-1 max-h-64 overflow-y-auto">
  {% for p in results %}
  <li>
    <button type="button"
            @click="
              $dispatch('product-selected', {
                id: {{ p.id }},
                sku: '{{ p.sku | e }}',
                desc: '{{ (p.title or '') | e }}',
                cost: '{{ '%.2f' | format(p.cost or 0) }}',
                core: '{{ '%.2f' | format(p.vendor_core_charge or 0) }}',
              });
              $el.closest('#po-product-results').innerHTML = '';
            "
            class="w-full text-left px-3 py-2 hover:bg-brand-50 transition-colors flex items-start gap-3">
      <span class="font-mono text-xs font-bold text-brand-700 shrink-0 pt-0.5 w-24">{{ p.sku }}</span>
      <span class="flex-1 min-w-0">
        <span class="text-sm text-gray-800 block truncate">{{ p.title | truncate(55) }}</span>
        <span class="text-xs text-gray-400">
          Cost ${{ '%.2f' | format(p.cost or 0) }}
          {% if p.vendor_core_charge %}· Core ${{ '%.2f' | format(p.vendor_core_charge) }}{% endif %}
          · {{ p.qty_on_hand }} on hand
        </span>
      </span>
    </button>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="px-3 py-2 text-xs text-gray-400">No products match.</p>
{% endif %}
