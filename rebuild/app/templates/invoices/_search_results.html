{# Product search results — Alpine reads data-* attributes to build typed result objects #}
{% for p in results %}
<div data-product
     data-id="{{ p.id }}"
     data-sku="{{ p.sku }}"
     data-title="{{ p.title or '' }}"
     data-price="{{ p.suggested_sell_price }}"
     data-cost="{{ p.cost }}"
     data-qoh="{{ p.qty_on_hand }}"
     data-has-core="{{ '1' if p.has_core else '0' }}"
     data-core="{{ p.customer_core_charge }}"></div>
{% endfor %}
