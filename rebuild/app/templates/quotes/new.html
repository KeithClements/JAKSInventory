{% extends "base.html" %}
{% block title %}New Quote — JAKS Inventory{% endblock %}
{% block heading %}New Quote{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="card"
       x-data
       @record-created.window="
         if ($event.detail.type === 'customer') {
           var sel = $el.querySelector('select[name=customer_id]');
           var opt = document.createElement('option');
           opt.value = $event.detail.id;
           opt.textContent = $event.detail.label;
           opt.selected = true;
           sel.appendChild(opt);
           sel.value = String($event.detail.id);
         }
       ">

    <div class="card-header">
      <span class="card-title">New Quote</span>
    </div>

    <form action="/quotes/new" method="post">
      <div class="card-body space-y-4">

        <div>
          <label class="form-label">Customer <span class="text-red-500">*</span></label>
          <div class="flex gap-2">
            <select name="customer_id" required class="form-select flex-1">
              <option value="">— Select customer —</option>
              {% for c in customers %}
              <option value="{{ c.id }}">{{ c.company_name }}{% if c.contact_name %} ({{ c.contact_name }}){% endif %}</option>
              {% endfor %}
            </select>
            <button type="button"
                    hx-get="/customers/quick-create-form"
                    hx-target="#create-slide-content"
                    hx-swap="innerHTML"
                    @click="$dispatch('open-create-slide', { title: 'New Customer' })"
                    class="btn-secondary btn-sm whitespace-nowrap">
              + New
            </button>
          </div>
        </div>

        <p class="text-xs text-gray-400">
          Discount %, validity period, and notes are all editable inside the quote workspace after creation.
        </p>

        <input type="hidden" name="discount_pct" value="0" />
        <input type="hidden" name="validity_days" value="30" />
        <input type="hidden" name="notes" value="" />

      </div>

      <div class="card-footer">
        <a href="/quotes/" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Create Quote →</button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
