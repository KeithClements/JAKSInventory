{#
  Quick Create Vendor slide-over content.
  Loaded via HTMX into #create-slide-content in base.html.
#}
<form
  class="flex flex-col flex-1 min-h-0"
  hx-post="/vendors/quick-create"
  hx-target="#create-slide-content"
  hx-swap="innerHTML"
>
  <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Vendor Name <span class="text-red-500">*</span>
      </label>
      <input type="text" name="name" required autofocus
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="e.g. PAI Industries"/>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Feed SKU Code <span class="text-red-500">*</span>
      </label>
      <input type="text" name="vendor_code" required maxlength="4"
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg font-mono uppercase
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="e.g. PAI, IMB, HHP"
             style="text-transform:uppercase"
             oninput="this.value = this.value.toUpperCase()"/>
      <p class="mt-1 text-xs text-gray-400">Matches JAKS-[CODE]- feed SKUs; the 1-digit SKU # auto-assigns (change it on the vendor page before the first import).</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
      <input type="tel" name="phone"
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="800-555-0100"/>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Account #</label>
      <input type="text" name="account_number"
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="Your account number with this vendor"/>
    </div>

    <label class="flex items-start gap-2 cursor-pointer">
      <input type="checkbox" name="private_label" value="1"
             class="mt-0.5 rounded border-gray-300 text-brand-600 focus:ring-brand-400" />
      <span class="text-sm">
        <span class="font-medium text-gray-700">Private label (sell as house brand)</span>
        <span class="block text-xs text-gray-400">
          Hide this vendor's code in SKUs (e.g. JAKS-JAKS-10R1273).
        </span>
      </span>
    </label>

  </div>

  <div class="flex justify-end gap-3 px-5 py-4 border-t border-gray-200 shrink-0">
    <button type="button"
            @click="createSlideOpen = false"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
      Cancel
    </button>
    <button type="submit"
            class="px-4 py-2 text-sm font-medium text-white bg-brand-700 hover:bg-brand-600 rounded-lg">
      Save &amp; Select
    </button>
  </div>
</form>
