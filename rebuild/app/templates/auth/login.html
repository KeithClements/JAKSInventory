<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Axle</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/axle-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-paper min-h-screen flex items-center justify-center font-sans">

  <form method="post" action="/login"
        class="bg-white border border-steel-200 rounded-[10px] px-8 py-8 w-full max-w-sm">

    {# Brand lockup — Hub mark + AXLE wordmark (Axle Logo System) #}
    <div class="flex items-center gap-3 mb-1">
      <svg class="w-9 h-9 shrink-0" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="none" stroke="#5a6630" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="32" cy="32" r="28"></circle>
          <circle cx="32" cy="32" r="17" stroke-width="3"></circle>
          <circle cx="32" cy="32" r="6.5" fill="#e7891d" stroke="none"></circle>
          <rect x="30" y="20" width="4" height="6" rx="1" fill="#5a6630" stroke="none"></rect>
        </g>
      </svg>
      <div>
        <h1 class="font-display font-bold text-ink uppercase"
            style="font-size: 26px; line-height: 0.8; letter-spacing: 0.01em;">Axle</h1>
        <p class="font-mono text-steel-400"
           style="font-size: 8px; letter-spacing: 0.3em; margin-top: 5px;">PARTS COUNTER SYSTEM</p>
      </div>
    </div>
    <p class="text-sm text-steel-500 mt-4 mb-6">Sign in to continue</p>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">
      Invalid username or password.
    </div>
    {% endif %}

    <label class="block font-display text-[10.5px] font-semibold uppercase tracking-[0.07em] text-steel-500 mb-1">Username</label>
    <input name="username" autofocus autocomplete="username" required
           class="w-full rounded-md border border-steel-200 px-3 py-2 mb-4 text-sm
                  focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400" />

    <label class="block font-display text-[10.5px] font-semibold uppercase tracking-[0.07em] text-steel-500 mb-1">Password</label>
    <input name="password" type="password" autocomplete="current-password" required
           class="w-full rounded-md border border-steel-200 px-3 py-2 mb-6 text-sm
                  focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400" />

    <button type="submit"
            class="w-full bg-brand-700 hover:bg-brand-600 text-white font-display font-semibold uppercase tracking-[0.06em]
                   rounded-[5px] px-4 py-2.5 text-xs transition-colors">
      Sign in
    </button>

  </form>

</body>
</html>
