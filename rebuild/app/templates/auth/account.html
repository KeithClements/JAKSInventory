<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — JAKS Inventory</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

  <form method="post" action="/account/password"
        class="bg-white shadow-md rounded-xl px-8 py-8 w-full max-w-sm">

    <h1 class="text-xl font-bold text-gray-800 mb-1">Change password</h1>
    <p class="text-sm text-gray-500 mb-6">Signed in as
      <span class="font-medium text-gray-700">{{ user.username }}</span></p>

    {% if ok %}
    <div class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-3 py-2 mb-4">
      Password updated.
    </div>
    {% endif %}
    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">
      {{ error }}
    </div>
    {% endif %}

    <label class="block text-xs font-medium text-gray-600 mb-1">Current password</label>
    <input name="current_password" type="password" autocomplete="current-password" required
           class="w-full rounded-lg border border-gray-200 px-3 py-2 mb-4 text-sm
                  focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400" />

    <label class="block text-xs font-medium text-gray-600 mb-1">New password
      <span class="text-gray-400">(min 8 characters)</span></label>
    <input name="new_password" type="password" autocomplete="new-password" required minlength="8"
           class="w-full rounded-lg border border-gray-200 px-3 py-2 mb-4 text-sm
                  focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400" />

    <label class="block text-xs font-medium text-gray-600 mb-1">Confirm new password</label>
    <input name="confirm_password" type="password" autocomplete="new-password" required minlength="8"
           class="w-full rounded-lg border border-gray-200 px-3 py-2 mb-6 text-sm
                  focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400" />

    <button type="submit"
            class="w-full bg-brand-700 hover:bg-brand-600 text-white font-medium
                   rounded-lg px-4 py-2 text-sm transition-colors">
      Update password
    </button>

    <a href="/" class="block text-center text-xs text-gray-500 mt-4 hover:text-gray-700">← Back to dashboard</a>

  </form>

</body>
</html>
