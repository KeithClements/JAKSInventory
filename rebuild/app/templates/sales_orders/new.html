{% extends "base.html" %}
{% block title %}New Sales Order — JAKS Inventory{% endblock %}
{% block heading %}New Sales Order{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <p class="text-sm text-gray-500 mb-5">
      Most orders are created via <a href="/quotes/" class="text-blue-600 hover:underline">Quote → Convert to SO</a>.
      Use this form for direct orders that don't start as quotes.
    </p>

    <form action="/sales-orders/new" method="post" class="space-y-5">

      <div
        x-data
        @record-created.window="
          if ($event.detail.type === 'customer') {
            var sel = $el.querySelector('select[name=customer_id]');
            var opt = document.createElement('option');
            opt.value = $event.detail.id;
            opt.textContent = $event.detail.label;
            opt.selected = true;
            sel.appendChild(opt);
            sel.value = String($event.detail.id);
          }
        "
      >
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Customer <span class="text-red-500">*</span>
        </label>
        <div class="flex gap-2">
          <select name="customer_id" required
                  class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm
                         focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400">
            <option value="">— Select customer —</option>
            {% for c in customers %}
            <option value="{{ c.id }}">{{ c.company_name }}{% if c.contact_name %} ({{ c.contact_name }}){% endif %}</option>
            {% endfor %}
          </select>
          <button type="button"
                  hx-get="/customers/quick-create-form"
                  hx-target="#create-slide-content"
                  hx-swap="innerHTML"
                  @click="$dispatch('open-create-slide', { title: 'New Customer' })"
                  class="px-3 py-2 text-sm font-medium text-brand-700 border border-brand-200
                         rounded-lg bg-brand-50 hover:bg-brand-100 transition-colors whitespace-nowrap">
            + New
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Payment Mode</label>
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="radio" name="payment_mode" value="{{ SOPaymentMode.NONE }}" checked class="accent-blue-600" />
            No deposit (bill on invoice)
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="radio" name="payment_mode" value="{{ SOPaymentMode.DEPOSIT }}" class="accent-blue-600" />
            Deposit required
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="radio" name="payment_mode" value="{{ SOPaymentMode.FULL }}" class="accent-blue-600" />
            Paid in full
          </label>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Customer PO #</label>
          <input type="text" name="customer_po_number" placeholder="Optional"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                        focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ESN</label>
          <input type="text" name="esn" placeholder="Engine serial number"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                        focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Engine Manufacturer</label>
          <input type="text" name="engine_manufacturer" placeholder="e.g. Cummins"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                        focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Engine Model</label>
          <input type="text" name="engine_model" placeholder="e.g. ISX15"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                        focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        <textarea name="notes" rows="2"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                         focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400 resize-none"></textarea>
      </div>

      <div class="flex items-center justify-between pt-2">
        <a href="/sales-orders/" class="text-sm text-gray-500 hover:text-gray-700">← Back</a>
        <button type="submit"
                class="px-5 py-2 bg-brand-700 text-white text-sm font-medium rounded-lg
                       hover:bg-brand-600 transition-colors">
          Create Sales Order →
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
