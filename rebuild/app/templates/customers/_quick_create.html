{#
  Quick Create Customer slide-over content.
  Loaded via HTMX into #create-slide-content in base.html.
  On save: closes slide-over, fires 'record-created' event with {type, id, label}.
#}
<form
  class="flex flex-col flex-1 min-h-0"
  hx-post="/customers/quick-create"
  hx-target="#create-slide-content"
  hx-swap="innerHTML"
>
  <div class="slide-over-body space-y-4">

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Company Name <span class="text-red-500">*</span>
      </label>
      <input type="text" name="company_name" required autofocus
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="e.g. Mike's Diesel Service"/>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Contact Name</label>
      <input type="text" name="contact_name"
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="First Last"/>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
      <input type="tel" name="phone"
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="402-555-0100"/>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email"
             class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-1 focus:ring-brand-400 focus:border-brand-400"
             placeholder="name@company.com"/>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Payment Terms</label>
      <select name="payment_terms"
              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-1 focus:ring-brand-400">
        <option value="cod">COD</option>
        <option value="net_30" selected>Net 30</option>
        <option value="net_60">Net 60</option>
      </select>
    </div>

  </div>

  <div class="slide-over-footer">
    <button type="button"
            @click="createSlideOpen = false"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
      Cancel
    </button>
    <button type="submit"
            class="px-4 py-2 text-sm font-medium text-white bg-brand-700 hover:bg-brand-600 rounded-lg">
      Save &amp; Select
    </button>
  </div>
</form>
