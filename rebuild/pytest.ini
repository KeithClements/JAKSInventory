[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Quiet the third-party deprecation noise (FastAPI on_event, Starlette template
# signature) so real test signal isn't buried. App code warnings still show.
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*

# Coverage opt-in: run `pytest --cov` to measure (config in .coveragerc).
# Left off by default so the plain `pytest` run stays fast.
